<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Randscope | Sign-up</title>
</head>
<body>
    <div class="container">
        <div class="background">
            <img src="Randscope_background.png" alt="Randscope Background Image">
        </div>
        <div class="content">
            <h1 class="heading">Get Started with Rand<span class="highlight">scope</span> today and take your budgeting to the next level!</h1>

            <div class="form-container">
                <form action="">
                    <div id="first-name">
                        <label for="firstname">First Name</label>
                        <input type="text" id="firstname" name="firstname" placeholder="John">
                    </div>

                    <div id="last-name">
                        <label for="lastname">Last Name</label>
                        <input type="text" id="lastname" name="lastname" placeholder="Doe">
                    </div>

                    <div id="e-mail">
                        <label for="email">E-Mail</label>
                        <input type="email" id="email" name="email" placeholder="johndoe@gmail.com">
                    </div>

                    <div id="phone">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="0784566789">
                    </div>
                    
                    <div id="password">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Password">
                    </div>
                    
                    <div id="confirm-password">
                        <label for="confirmpassword">Confirm Password</label>
                        <input type="password" id="confirmpassword" name="confirmpassword" placeholder="Confirm Password">
                    </div>

                    <div class="button">
                        <button type="submit">Submit</button>
                    </div>
                </form>

                <p>Already have an account? <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank">Log In</a></p>
            </div>
        </div>
    </div>
</body>
</html>
